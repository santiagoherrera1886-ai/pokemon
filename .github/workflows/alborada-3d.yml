name: Alborada 3D verification
on:
  push:
    branches: [feature/alborada-3d]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
permissions:
  contents: read
concurrency:
  group: alborada-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:unit && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:graphics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: comparison-and-graphics-report
          path: tests/screenshots/graphics
          retention-days: 14
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [classic, premium]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          GRAPHICS_MODE: ${{ matrix.mode }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gameplay-${{ matrix.mode }}
          path: tests/screenshots/${{ matrix.mode }}
          retention-days: 14
