<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1f2b">
<meta name="description" content="Alborada — aventura original de criaturas con el estilo de las portátiles de doble pantalla. Se juega en el navegador, sin ROM.">
<title>Alborada · Edición Bruma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<link rel="stylesheet" href="./styles.css">
</head>
<body class="at-title">
<main id="app">
  <div id="ds">
    <div class="screen" id="topScreen">
      <canvas id="top" width="256" height="192" aria-label="Pantalla superior del juego"></canvas>
      <div id="ui" class="ui">
        <button id="menuBtn" class="hidden" aria-label="Abrir menú">☰</button>
        <div id="banner" class="hidden"></div>
        <div id="hudFoe" class="hud foe hidden"></div>
        <div id="hudAlly" class="hud ally hidden"></div>
        <div id="logo"><h1>ALBORADA</h1><p>EDICIÓN BRUMA</p></div>
        <div id="msg" class="hidden"><span id="msgName" class="hidden"></span><p id="msgText"></p><i id="msgArrow" class="hidden">▼</i></div>
        <div id="toast" class="hidden"></div>
        <div id="fade"></div>
      </div>
    </div>
    <div class="hinge"><span></span><span></span></div>
    <div class="screen" id="bottomScreen"><div id="panel" class="ui bottom-ui"></div></div>
  </div>
  <div id="pad" aria-label="Controles táctiles">
    <div class="dpad">
      <button data-btn="up" class="u" aria-label="Arriba"></button>
      <button data-btn="left" class="l" aria-label="Izquierda"></button>
      <button data-btn="right" class="r" aria-label="Derecha"></button>
      <button data-btn="down" class="d" aria-label="Abajo"></button>
      <span class="c"></span>
    </div>
    <div class="mid"><button data-btn="start" class="start">START</button></div>
    <div class="ab">
      <button data-btn="b" class="b" aria-label="Botón B">B</button>
      <button data-btn="a" class="a" aria-label="Botón A">A</button>
    </div>
  </div>
</main>
<noscript>Este juego necesita JavaScript.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
